name: Daily test
on:
  schedule:
    - cron: '0 0 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Random test
        run: GOMAXPROCS=1 go test ./internal/stamper/ -v -count=1 -run TestRandomSimulation$

